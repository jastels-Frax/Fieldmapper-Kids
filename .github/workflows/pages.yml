# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# Needs Settings > Pages > Build and deployment > Source = "GitHub Actions".
# With "Deploy from a branch" Pages serves the raw source instead, whose
# index.html asks for src/main.ts, which a browser cannot run: a white screen.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # "Deploy from a branch" would publish the unbuilt source over this build (a white
      # screen). Try to switch the source to this workflow; if the token may not, the
      # step says so and a repository admin switches it in Settings > Pages.
      - name: Make GitHub Actions the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "Pages build_type: $type"
          if [ "$type" != "workflow" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow \
              && echo "Switched the Pages source to GitHub Actions." \
              || echo "::warning::Could not switch the Pages source. Set Settings > Pages > Source to 'GitHub Actions', then re-run this workflow."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
