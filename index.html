<!doctype html>
<html lang="en" data-mode="explorer">
  <head>
    <meta charset="UTF-8" />
    <!-- Scout talks to itself and the two map services, and nothing else. Scripts come from Scout alone (boot.js is
         a file, not inline). Map pictures are fetched with no referrer, so the services are not told the page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; connect-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; font-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4a3826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scout" />
    <meta name="description" content="Explore and collect the world around you." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Scout</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Scout needs JavaScript turned on.</noscript>
    <script src="./boot.js"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
